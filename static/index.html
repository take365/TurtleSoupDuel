<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>うみがめのスープ Duel (v0.1)</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; }
      .row { margin: 0.5rem 0; }
      textarea { width: 100%; height: 4rem; }
      pre { background: #f7f7f7; padding: 0.5rem; }
      .pill { display: inline-block; padding: 0 0.5rem; background: #eee; margin-right: 0.25rem; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>うみがめのスープ Duel</h1>
    <div id="themes"></div>
    <div class="row">
      <button id="refreshThemes">テーマ一覧を取得</button>
    </div>
    <div class="row">
      <label>Theme ID: <input id="themeId" placeholder="turtle-0001" /></label>
      <label>AI Model: <input id="aiModel" placeholder="(空なら.envのAI_MODEL)" value=""/></label>
      <button id="start">/game/start</button>
    </div>
    <hr/>
    <div>
      <div class="row">
        <strong>質問（ユーザ）:</strong>
        <textarea id="userQ" placeholder="Yes/Noで応答できる質問"></textarea>
        <button id="sendUserQ">/game/user/question</button>
      </div>
      <div class="row">
        <strong>最終解答（ユーザ）:</strong>
        <textarea id="userG" placeholder="最終解答"></textarea>
        <button id="sendUserG">/game/user/guess</button>
      </div>
      <div class="row">
        <button id="aiQ">/game/ai/question</button>
        <button id="aiG">/game/ai/guess</button>
        <button id="next">/game/next</button>
        <button id="state">/game/state</button>
      </div>
      <h3>状態</h3>
      <pre id="out"></pre>
      <div id="models"></div>
    </div>

    <script>
      const out = document.getElementById('out');
      function show(obj) { out.textContent = JSON.stringify(obj, null, 2); }
      function showModels(m) {
        const el = document.getElementById('models');
        if (!m) { el.textContent = ''; return; }
        el.innerHTML = `<p><strong>MC:</strong> ${m.mc_provider}:${m.mc_model} | <strong>AI:</strong> ${m.ai_provider}:${m.ai_model}</p>`;
      }
      async function api(path, init) {
        const r = await fetch('/api/v1' + path, { headers: { 'Content-Type': 'application/json' }, ...init });
        const t = await r.text();
        try { return JSON.parse(t); } catch { return t; }
      }
      document.getElementById('refreshThemes').onclick = async () => {
        const list = await api('/themes');
        const el = document.getElementById('themes');
        el.innerHTML = '<h3>テーマ</h3>' + list.map(t => `<div><code>${t.id}</code> — ${t.title} ${t.tags? t.tags.map(x=>`<span class="pill">${x}</span>`).join(''):''}</div>`).join('');
      };
      document.getElementById('start').onclick = async () => {
        const theme_id = document.getElementById('themeId').value || 'turtle-0001';
        const ai_model = document.getElementById('aiModel').value.trim();
        const payload = ai_model ? { theme_id, ai_model } : { theme_id };
        const res = await api('/game/start', { method: 'POST', body: JSON.stringify(payload) });
        show(res);
      };
      document.getElementById('sendUserQ').onclick = async () => {
        const text = document.getElementById('userQ').value;
        const res = await api('/game/user/question', { method: 'POST', body: JSON.stringify({ text }) });
        show(res);
      };
      document.getElementById('sendUserG').onclick = async () => {
        const text = document.getElementById('userG').value;
        const res = await api('/game/user/guess', { method: 'POST', body: JSON.stringify({ text }) });
        show(res);
      };
      document.getElementById('aiQ').onclick = async () => { show(await api('/game/ai/question', { method: 'POST' })); };
      document.getElementById('aiG').onclick = async () => { show(await api('/game/ai/guess', { method: 'POST' })); };
      document.getElementById('next').onclick = async () => { show(await api('/game/next', { method: 'POST' })); };
      document.getElementById('state').onclick = async () => {
        const s = await api('/game/state');
        show(s);
        showModels(s.models);
      };
    </script>
  </body>
  </html>
